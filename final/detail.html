<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Location Detail</title>
	<link rel="stylesheet" href="/style/style.css" />
</head>

<body>
	<main class="page">
		<p><a class="btn" href="/">Back to map</a></p>
		<h1>Location Detail</h1>
		<section id="detail" class="card">Loading...</section>
		<section id="voteSection" class="card">Loading votes...</section>
		<section class="card">
			<h2>Discussion</h2>
			<form id="commentForm" class="stack">
				<div>
					<label for="commentText">Add a comment</label>
					<textarea id="commentText" rows="3" required></textarea>
				</div>
				<div class="form-actions-right">
					<button class="btn" type="submit">Post comment</button>
				</div>
			</form>
			<div id="comments" class="stack"></div>
		</section>
	</main>

	<script src="/js/detail.js"></script>
</body>

</html>
