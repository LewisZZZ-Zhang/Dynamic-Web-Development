<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>NYC Map</title>

	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
	<link rel="stylesheet" href="/style/style.css" />
</head>

<body class="map-page">
	<main>
		<div class="map-shell">
			<div id="map"></div>
			<div class="floating-controls floating-left">
				<a class="btn" href="/search">Search by movie name</a>
				<a class="btn" href="/popular">View most popular locations</a>
			</div>
			<div class="floating-controls floating-right">
				<a class="btn" href="/add-location">Add a new location</a>
			</div>
		</div>
	</main>

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script src="/js/index.js"></script>
</body>

</html>
