<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Marvel NYC Map</title>

	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
	<link rel="stylesheet" href="/style/style.css" />
</head>

<body class="map-page">
	<main>
			<header class="topbar topbar--home">
				<div class="topbar-left">
					<h1>
						<span class="hero-title-main">Movie Locations Map</span>
						<span class="hero-title-sub">New York in Marvel Movies</span>
					</h1>
				</div>
				<div class="topbar-right">
					<a href="/" aria-label="Home">
					<img class="topbar-logo" src="/style/logo.png" alt="Marvel map logo" />
				</a>
			</div>
		</header>
		<div class="map-shell">
			<div id="map"></div>
			<a class="map-floating-logo" href="/" aria-label="Home">
				<img class="topbar-logo" src="/style/logo.png" alt="Marvel map logo" />
			</a>
			<div class="map-controls-drawer floating-top-right">
				<button class="btn map-controls-toggle" type="button" aria-expanded="false" aria-controls="mapControls">
					Menu
				</button>
				<div id="mapControls" class="floating-controls">
					<a class="btn" href="/popular">🔥 View most popular locations</a>
					<a class="btn" href="/search">🔍 Search by movie name</a>
					<a class="btn" href="/random">🎲 Random location</a>
					<a class="btn" href="/add-location">➕ Add a new location</a>
					<a class="btn" href="/about">ℹ️ About + Community</a>
				</div>
			</div>
		</div>
	</main>

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script src="/js/index.js"></script>
</body>

</html>
