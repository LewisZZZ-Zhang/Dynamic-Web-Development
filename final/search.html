<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Search by movie name</title>
	<link rel="stylesheet" href="/style/style.css" />
</head>

<body>
	<header class="topbar page-topbar">
		<div class="topbar-left">
			<a class="btn" href="/">Back to map</a>
		</div>
		<div class="topbar-center">
			<h1>Search by movie name</h1>
		</div>
		<div class="topbar-right">
			<a href="/" aria-label="Home">
				<img class="topbar-logo" src="/style/logo.png" alt="Marvel map logo" />
			</a>
		</div>
	</header>
	<main class="page">
		<form class="card stack search-form" method="get" action="/search">
			<div>
				<label for="movie">Movie name</label>
				<input id="movie" name="movie" type="text" placeholder="e.g. Spider-Man" />
			</div>
			<div class="form-actions-right">
				<button class="btn" type="submit">Search</button>
			</div>
		</form>
		<section id="results" class="stack"></section>
	</main>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="/js/jquery-enhancements.js"></script>
	<script src="/js/search.js"></script>
</body>

</html>
