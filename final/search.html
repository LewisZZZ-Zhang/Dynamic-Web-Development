<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Search by movie name</title>
	<link rel="stylesheet" href="/style/style.css" />
</head>

<body>
	<main class="page">
		<p><a class="btn" href="/">Back to map</a></p>
		<h1>Search by movie name</h1>
		<section class="card stack">
			<div>
				<label for="movie">Movie name</label>
				<input id="movie" type="text" placeholder="e.g. Spider-Man" />
			</div>
			<div>
				<button class="btn" id="searchBtn" type="button">Search</button>
			</div>
		</section>
		<section id="results" class="stack"></section>
	</main>

	<script src="/js/search.js"></script>
</body>

</html>
