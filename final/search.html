<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Search by movie name</title>
	<link rel="stylesheet" href="/style/style.css" />
</head>

<body>
	<header class="topbar page-topbar">
		<a class="btn" href="/">Back to map</a>
		<h1>Search by movie name</h1>
	</header>
	<main class="page">
		<form class="card stack" method="get" action="/search">
			<div>
				<label for="movie">Movie name</label>
				<input id="movie" name="movie" type="text" placeholder="e.g. Spider-Man" />
			</div>
			<div class="form-actions-right">
				<button class="btn" type="submit">Search</button>
			</div>
		</form>
		<section id="results" class="stack"></section>
	</main>

	<script src="/js/search.js"></script>
</body>

</html>
