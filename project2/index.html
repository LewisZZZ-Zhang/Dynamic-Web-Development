<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 2</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <!-- <h1>Shanghai</h1> -->
    </header>
    
    <div class="center-text title-text">
        <div class="center-line title">Shanghai</div>
    </div>

    <div class="background-overlay"></div>
    
    <div class="center-text subtitle-text">
        <div class="center-line">where</div>
        <div class="center-line">____ meets the ____</div>
    </div>
    
    <main>
        <!-- Row 1 -->
        <div class="row-container">
            <div class="vertical-text left">Future</div>
            <div class="image-row">
                <div class="image-container" style="--width-ratio: 48%;">
                    <img src="assets/1.png" alt="Image 1-1">
                </div>
                <div class="image-container" style="--width-ratio: 40%;">
                    <img src="assets/2.jpg" alt="Image 1-2">
                </div>
            </div>
            <div class="vertical-text right">Past</div>
        </div>

        <!-- Row 2 -->
        <div class="row-container">
            <div class="vertical-text left">Creative</div>
            <div class="image-row">
                <div class="image-container" style="--width-ratio: 28%;">
                    <img src="assets/3.jpg" alt="Image 2-1">
                </div>
                <div class="image-container" style="--width-ratio: 25%;">
                    <img src="assets/4.jpg" alt="Image 2-2">
                </div>
            </div>
            <div class="vertical-text right">Traditional</div>
        </div>

        <!-- Row 3 -->
        <div class="row-container">
            <div class="vertical-text left">Global</div>
            <div class="image-row">
                <div class="image-container" style="--width-ratio: 34%;">
                    <img src="assets/5.jpg" alt="Image 3-1">
                </div>
                <div class="image-container" style="--width-ratio: 30%;">
                    <img src="assets/6.jpg" alt="Image 3-2">
                </div>
            </div>
            <div class="vertical-text right">Domestic</div>
        </div>

        <!-- Row 4 -->
        <div class="row-container">
            <div class="vertical-text left">Order</div>
            <div class="image-row">
                <div class="image-container" style="--width-ratio: 14%;">
                    <img src="assets/7.jpeg" alt="Image 4-1">
                </div>
                <div class="image-container" style="--width-ratio: 20%;">
                    <img src="assets/8.jpeg" alt="Image 4-2">
                </div>
            </div>
            <div class="vertical-text right">Chaos</div>
        </div>

        <div class="row-container">
            <div class="vertical-text left">City</div>
            <div class="image-row">
                <div class="image-container" style="--width-ratio: 22%;">
                    <img src="assets/9.jpeg" alt="Image 4-1">
                </div>
                <div class="image-container" style="--width-ratio: 12%;">
                    <img src="assets/10.png" alt="Image 4-2">
                </div>
            </div>
            <div class="vertical-text right">Nature</div>
        </div>

        <div class="row-container">
            <div class="vertical-text left">Work</div>
            <div class="image-row">
                <div class="image-container" style="--width-ratio: 10%;">
                    <img src="assets/11.png" alt="Image 4-1">
                </div>
                <div class="image-container" style="--width-ratio: 18%;">
                    <img src="assets/12.png" alt="Image 4-2">
                </div>
            </div>
            <div class="vertical-text right">Hobby</div>
        </div>

    </main>
    
    <script src="script.js"></script>
</body>
</html>
