<html>
<head>
    <title>A Random Artwork From A year</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title">A Random Artwork From A year</h1>
    <p>Using Art Institute of Chicago API</p>

    <div class="timeline" aria-label="Timeline">
        <span class="timeline-dot"></span>
        <span class="timeline-dot"></span>
        <span class="timeline-dot"></span>
        <span class="timeline-label" data-offset="-1">1</span>
        <span class="timeline-label" data-offset="0">2</span>
        <span class="timeline-label" data-offset="1">3</span>
    </div>

    <section class="artwork-grid" aria-label="Artwork results">
        <article class="artwork-card" aria-label="Previous artwork">
            <h2 id="yearPrev"></h2>
            <img id="imgPrev" alt="" />
            <p id="emptyPrev"></p>
            <h3 id="titlePrev"></h3>
            <p id="artistPrev"></p>
            <p id="datePrev"></p>
            <a id="linkPrev" href="" target="_blank" rel="noreferrer">View artwork</a>
        </article>
        <article class="artwork-card" aria-label="Current artwork">
            <h2 id="yearCurrent"></h2>
            <img id="imgCurrent" alt="" />
            <p id="emptyCurrent"></p>
            <h3 id="titleCurrent"></h3>
            <p id="artistCurrent"></p>
            <p id="dateCurrent"></p>
            <a id="linkCurrent" href="" target="_blank" rel="noreferrer">View artwork</a>
        </article>
        <article class="artwork-card" aria-label="Next artwork">
            <h2 id="yearNext"></h2>
            <img id="imgNext" alt="" />
            <p id="emptyNext"></p>
            <h3 id="titleNext"></h3>
            <p id="artistNext"></p>
            <p id="dateNext"></p>
            <a id="linkNext" href="" target="_blank" rel="noreferrer">View artwork</a>
        </article>
    </section>

    <p id="status"></p>

    <button class="nav-button nav-left" type="button" aria-label="Previous">&lt;</button>
    <button class="nav-button nav-right" type="button" aria-label="Next">&gt;</button>
    <button class="nav-button nav-center" type="button" id="refreshCurrent" aria-label="Refresh current">Refresh</button>

    <script src="main.js" defer></script>
</body>
</html>
